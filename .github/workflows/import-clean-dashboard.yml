name: Import clean dashboard source

on:
  workflow_dispatch:
  push:
    branches:
      - frontend-dashboard-clean
    paths:
      - .github/workflows/import-clean-dashboard.yml

permissions:
  contents: write

jobs:
  import-clean-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: frontend-dashboard-clean
          fetch-depth: 0

      - name: Fetch clean dashboard source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zahirulk92-maker/DSE-Market-Data-Dashboard.git /tmp/dse-dashboard
          rm -rf /tmp/dse-dashboard/.git
          rm -rf /tmp/dse-dashboard/.agents /tmp/dse-dashboard/.conversation
          rm -rf /tmp/dse-dashboard/artifacts/mockup-sandbox
          rm -f /tmp/dse-dashboard/.replit /tmp/dse-dashboard/.replitignore /tmp/dse-dashboard/replit.md
          find /tmp/dse-dashboard -type d \( -name node_modules -o -name dist -o -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .replit-artifact \) -prune -exec rm -rf {} + || true
          find /tmp/dse-dashboard -type f -name .DS_Store -delete || true

      - name: Replace branch contents with cleaned source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/import-clean-dashboard.yml' /tmp/dse-dashboard/ ./

      - name: Commit and push clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import cleaned DSE dashboard source'
          git push origin HEAD:frontend-dashboard-clean
