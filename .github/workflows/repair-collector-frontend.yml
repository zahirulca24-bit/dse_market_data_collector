name: Repair collector and frontend integration

on:
  push:
    branches:
      - repair-collector-frontend
    paths:
      - .github/workflows/repair-collector-frontend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair-collector-frontend
          fetch-depth: 0

      - name: Restore working collector engine
        shell: bash
        run: |
          set -euo pipefail
          GOOD=d230c994c1c10a5979ed257b2c9422bcdbc9ab79
          git checkout "$GOOD" -- .env.example requirements.txt src/dse_collector
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          git checkout "$GOOD" -- supabase/migrations/001_create_dse_market_tables.sql supabase/migrations/002_collector_lock_and_status.sql

          # Old ZIP backend/collector are not used. Keep the React dashboard source only.
          rm -rf collector artifacts/api-server

          cat > build.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          pip install -r requirements.txt

          corepack enable || true
          corepack prepare pnpm@10.4.1 --activate || npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/dse-market-dashboard run build

          rm -rf frontend/dist
          mkdir -p frontend/dist
          cp -R artifacts/dse-market-dashboard/dist/. frontend/dist/
          echo "Frontend build complete: frontend/dist"
          EOF
          chmod +x build.sh

          cat > render.yaml <<'EOF'
          services:
            - type: web
              name: dse-market-data-collector
              runtime: python
              plan: free
              buildCommand: bash build.sh
              startCommand: uvicorn dse_collector.web:app --host 0.0.0.0 --port $PORT --app-dir src
              healthCheckPath: /health
              autoDeploy: true
              envVars:
                - key: PYTHON_VERSION
                  value: 3.12.8
                - key: SUPABASE_URL
                  sync: false
                - key: SUPABASE_SERVICE_ROLE_KEY
                  sync: false
                - key: CRON_SECRET
                  sync: false
                - key: ENFORCE_MARKET_WINDOW
                  value: "true"
                - key: MARKET_TIMEZONE
                  value: Asia/Dhaka
                - key: MARKET_OPEN
                  value: "10:00"
                - key: MARKET_CLOSE
                  value: "14:10"
                - key: MARKET_DAYS
                  value: "6,0,1,2,3"
          EOF

          rm -f .github/workflows/import-clean-dashboard.yml
          rm -f .github/workflows/repair-collector-frontend.yml

      - name: Commit repaired integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair collector engine and wire clean dashboard frontend'
          git push origin HEAD:repair-collector-frontend
