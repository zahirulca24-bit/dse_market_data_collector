name: Collect DSE market data

on:
  workflow_dispatch:
  schedule:
    # DSE trades Sunday-Thursday, currently 10:00-14:10 Asia/Dhaka (UTC+6).
    - cron: '*/5 4-7 * * 0-4'
    - cron: '0-10/5 8 * * 0-4'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and store market data
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DSE_SOURCE_URL: https://www.dsebd.org/latest_share_price_scroll_by_ltp.php
        run: python -m dse_collector.main
